<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学校页面 · 恢复操作验证</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:20px;line-height:1.5}main{max-width:440px;margin:auto}label{display:block;margin:12px 0}input,select{box-sizing:border-box;width:100%;font:inherit;min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>学校登录恢复</h1><p>实际提示组件与合成状态，表单不会提交。</p><label>场景<select id="scenario"></select></label><form onsubmit="return false"><label>学校账号<input name="username"></label><label>密码<input name="password" type="password"></label></form><pre id="sent"></pre></main><script type="module">
import {renderStatusBanner} from '../../../src/content/status-banner.ts';
const states={preparing:{kind:'recovering',message:'正在准备学校登录。正在将学校登录状态同步到此浏览器。',action:null},password:{kind:'manual_required',message:'学校密码需要更新。请在 Auth 更新已保存的密码。',action:{type:'OPEN_SETTINGS',label:'更新学校密码'}},reconnect:{kind:'manual_required',message:'需要重新连接 Auth。请重新授权此设备。',action:{type:'OPEN_SETTINGS',label:'重新连接此设备'}},foreign:{kind:'manual_required',message:'正在保留已有学校登录。只有选择切换后才会替换。',action:{type:'SWITCH_TO_MANAGED',label:'切换到快捷登录'}},verification:{kind:'manual_required',message:'需要手动完成学校验证。',action:{type:'ENTER_MANUAL',label:'手动完成学校验证'}},manual:{kind:'manual_required',message:'已切换为手动登录，可直接在下方输入。',action:{type:'RETRY_AUTOMATIC',label:'恢复快捷登录'}},update:{kind:'manual_required',message:'需要更新插件，请更新后重试。',action:{type:'CHECK_EXTENSION_UPDATE',label:'检查更新'}},contract:{kind:'manual_required',message:'暂时无法读取服务状态。请重新检查；若持续出现，请更新插件。',action:{type:'RETRY_AUTOMATIC',label:'重新检查'}},waiting:{kind:'manual_required',message:'学校登录暂时不可用，稍后自动重试。',action:null},failure:{kind:'manual_required',message:'快捷登录未成功，请手动登录或重试。'}};
const select=document.querySelector('#scenario');for(const value of Object.keys(states))select.add(new Option(value,value));
const send=type=>{document.querySelector('#sent').textContent=type;if(type==='ENTER_MANUAL'){select.value='manual';render();}};
function render(){renderStatusBanner(document,states[select.value],send);}select.onchange=render;render();
</script></html>
