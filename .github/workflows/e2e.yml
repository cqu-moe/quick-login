name: Extension E2E

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    concurrency:
      group: extension-e2e-changes-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/changes
        id: changes

  journeys:
    concurrency:
      group: extension-e2e-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.partition.suite }}-${{ matrix.partition.shard }}-${{ matrix.viewport }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: Real MV3 journeys (${{ matrix.partition.suite }}, ${{ matrix.viewport }}, ${{ matrix.partition.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        partition:
          - { suite: core, shard: 1/4, selector: --grep-invert }
          - { suite: core, shard: 2/4, selector: --grep-invert }
          - { suite: core, shard: 3/4, selector: --grep-invert }
          - { suite: core, shard: 4/4, selector: --grep-invert }
          - { suite: devices, shard: 1/2, selector: --grep }
          - { suite: devices, shard: 2/2, selector: --grep }
    env:
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      WRANGLER_SEND_METRICS: "false"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      QUICKLOGIN_E2E_AUTH_PATH: ${{ github.workspace }}/.e2e-auth
      QUICKLOGIN_E2E_AUTH_COMMIT: 41147c934c577f6a10f5bf3d9cb71597c362a07f
      QUICKLOGIN_E2E_VIEWPORT: ${{ matrix.viewport }}
      QUICKLOGIN_E2E_SUITE: ${{ matrix.partition.suite }}
      QUICKLOGIN_E2E_SHARD: ${{ matrix.partition.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout pinned Auth dependency
        run: |
          git init .e2e-auth
          git -C .e2e-auth remote add origin https://github.com/cqu-moe/auth.git
          git -C .e2e-auth fetch --depth 1 origin "$QUICKLOGIN_E2E_AUTH_COMMIT"
          git -C .e2e-auth checkout --detach FETCH_HEAD
          test "$(git -C .e2e-auth rev-parse HEAD)" = "$QUICKLOGIN_E2E_AUTH_COMMIT"
      - name: Restore pinned Auth frontend
        id: auth-frontend
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .e2e-auth/frontend/dist
          key: auth-frontend-${{ runner.os }}-${{ runner.arch }}-${{ env.QUICKLOGIN_E2E_AUTH_COMMIT }}-node22.22.3-no-telemetry-v1
      - if: steps.auth-frontend.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: .e2e-auth/frontend/package.json
          cache: true
          cache_dependency_path: .e2e-auth/frontend/pnpm-lock.yaml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .e2e-auth/package-lock.json
      - run: npm ci --prefer-offline
      - name: Restore browser system-package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/quicklogin-apt/*.deb
          key: apt-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and all system dependencies
        env:
          APT_ARCHIVES: ${{ runner.temp }}/quicklogin-apt
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          printf 'Dir::Cache::archives "%s";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\n' "$APT_ARCHIVES" | sudo tee /etc/apt/apt.conf.d/99-quicklogin-cache
          # The Azure mirror throttled font downloads to 41.5 kB/s in measured runs.
          sudo find /etc/apt -maxdepth 2 \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          npx --no-install e2e-web install chromium --with-deps
      - run: npm run build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: ""
      - name: Verify native toolbar popup layout
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' && matrix.viewport == 'desktop'
        run: npm run test:popup
      - name: Verify content event trust boundary
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' && matrix.viewport == 'desktop'
        run: npm run test:content-events
      - name: Keep native popup layout evidence
        if: ${{ !cancelled() && matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' && matrix.viewport == 'desktop' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quicklogin-popup-layout-${{ github.sha }}
          path: .e2e/launcher-smoke-*/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Require denied CONNECT reset survival and tunnel cleanup
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4'
        run: node e2e/network-reset-check.mjs .e2e/network-reset-control
      - name: Keep CONNECT reset control evidence
        if: ${{ !cancelled() && matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quicklogin-network-control-${{ github.sha }}-${{ matrix.viewport }}
          path: .e2e/network-reset-control/control.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve business and closed-page capture failures
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4'
        run: node --experimental-strip-types e2e/artifact-failure-check.ts .e2e/artifact-failure-control
      - name: Keep artifact-capture control evidence
        if: ${{ !cancelled() && matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quicklogin-capture-control-${{ github.sha }}-${{ matrix.viewport }}
          path: .e2e/artifact-failure-control/control.json
          if-no-files-found: error
          retention-days: 14
      - run: npm ci --prefer-offline
        working-directory: .e2e-auth
      - if: steps.auth-frontend.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        working-directory: .e2e-auth/frontend
      - if: steps.auth-frontend.outputs.cache-hit != 'true'
        run: pnpm run build
        working-directory: .e2e-auth/frontend
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: ""
      - name: Verify OTP metadata collisions and explicit secret scanning
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4' && matrix.viewport == 'desktop'
        run: node e2e/artifact-mail-check.mjs
      - name: Build actual pinned Auth browser runtime
        working-directory: .e2e-auth
        run: node e2e/school/build.mjs
      - name: Pull pinned native container interceptor
        run: docker pull cloudflare/proxy-everything:3cb1195@sha256:0ef6716c52430096900b150d84a3302057d6cd2319dae7987128c85d0733e3c8
      - name: Run two independent E2E rounds and assigned device controls
        run: |
          mkdir -p .e2e
          QUICKLOGIN_E2E_OUTPUT=.e2e/ci-run-1 node e2e/run.mjs ${{ matrix.partition.selector }} '^QUICKLOGIN-03 ' --shard '${{ matrix.partition.shard }}' &
          first_round=$!
          QUICKLOGIN_E2E_OUTPUT=.e2e/ci-run-2 node e2e/run.mjs ${{ matrix.partition.selector }} '^QUICKLOGIN-03 ' --shard '${{ matrix.partition.shard }}' &
          second_round=$!
          if [ "$QUICKLOGIN_E2E_SUITE" = devices ] && [ "$QUICKLOGIN_E2E_SHARD" = 1/2 ]; then
            node e2e/device-controls.mjs &
            device_controls=$!
          fi
          rounds_status=0
          wait "$first_round" || rounds_status=1
          wait "$second_round" || rounds_status=1
          if [ -n "${device_controls:-}" ]; then
            wait "$device_controls" || rounds_status=1
          fi
          exit "$rounds_status"
      - name: Require expected assertion failure
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4'
        run: node e2e/self-check.mjs
      - name: Require zero-selection failure
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4'
        run: node e2e/zero-check.mjs
      - name: Require startup, cleanup and combined failures
        if: matrix.partition.suite == 'core' && matrix.partition.shard == '1/4'
        run: node e2e/lifecycle-check.mjs
      - name: Prepare sanitized evidence even after a failure
        if: ${{ !cancelled() }}
        run: node e2e/prepare-ci-artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: quicklogin-e2e-${{ github.sha }}-${{ matrix.partition.suite }}-${{ matrix.viewport }}-${{ strategy.job-index }}
          path: ci-e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quicklogin:
    name: Real MV3 Auth, school cookies and recovery
    needs: [changes, journeys]
    # Fail closed on cancellation without holding a workflow concurrency lock.
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every suite and its two-round artifact admission
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.required }}
          SUITES_RESULT: ${{ needs.journeys.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$REQUIRED" = false || test "$SUITES_RESULT" = success
      - if: needs.changes.outputs.required == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - if: needs.changes.outputs.required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: quicklogin-e2e-${{ github.sha }}-*
          path: .e2e/admission
      - name: Require complete disjoint coverage and all failure controls
        if: needs.changes.outputs.required == 'true'
        run: node e2e/check-shards.mjs .e2e/admission
