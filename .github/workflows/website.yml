name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-website.mjs"
      - "package*.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/actions/verify/**"
      - ".github/workflows/website.yml"
permissions:
  contents: read
concurrency:
  group: quicklogin-website-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: quicklogin-website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.3"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/verify
        with:
          posthog-project-token: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      - name: Deploy static assets
        run: npx wrangler deploy --config website/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Read back website
        run: |
          curl --fail --silent --show-error https://quicklogin.cqu.moe/ -o /tmp/quicklogin-home.html
          python3 -c 'from pathlib import Path; assert "QuickLogin" in Path("/tmp/quicklogin-home.html").read_text()'
