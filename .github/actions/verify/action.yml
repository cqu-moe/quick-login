name: Verify QuickLogin
description: Run extension, website and release quality gates
inputs:
  posthog-project-token:
    description: Optional public browser analytics project token
    required: false
    default: ""
runs:
  using: composite
  steps:
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
    - run: pnpm run typecheck
      shell: bash
    - run: pnpm test
      shell: bash
    - run: pnpm run test:release
      shell: bash
    - run: pnpm run build
      shell: bash
      env:
        VITE_POSTHOG_PROJECT_TOKEN: ${{ inputs.posthog-project-token }}
        VITE_POSTHOG_HOST: https://p.cqu.moe
    - run: pnpm run check:package
      shell: bash
    - run: pnpm run typecheck:website
      shell: bash
    - run: pnpm run build:website
      shell: bash
      env:
        VITE_POSTHOG_PROJECT_TOKEN: ${{ inputs.posthog-project-token }}
        VITE_POSTHOG_HOST: https://p.cqu.moe
    - run: pnpm run check:website
      shell: bash
