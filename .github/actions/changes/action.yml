name: Detect executable changes
description: Keep required checks reportable for prose-only pushes and PRs
outputs:
  required:
    value: ${{ steps.changes.outputs.required }}
runs:
  using: composite
  steps:
    - id: changes
      shell: bash
      env:
        CI_EVENT: ${{ github.event_name }}
        CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 scripts/ci-changes.py
