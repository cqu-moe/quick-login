<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafbf9"><title>更新记录 · QuickLogin</title><meta name="description" content="查看 QuickLogin 已发布内测版本的功能改进与修复记录。"><link rel="canonical" href="https://quicklogin.cqu.moe/changelog/"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate" type="application/rss+xml" title="QuickLogin 更新记录" href="/changelog/rss.xml"></head><body><!-- header --><main id="main" class="wrap"><header class="page-intro"><p class="eyebrow">WHAT’S NEW</p><h1>每次更新，少一点阻碍。</h1><p>这里记录面向使用者的变化。可下载版本以<a class="text-link" href="/download/">下载页</a>的实时信息为准。</p></header><section class="article"><article class="changelog-entry"><time datetime="2026-09-28">2026.09.28</time><div><h2>0.3.4 <span class="tag">内测</span></h2><ul><li>授权失效时，明确提示前往 Auth 恢复原设备连接。</li><li>修复部分状态下无法重新开启快捷登录的问题。</li><li>保留原设备升级，无需卸载重装。</li></ul></div></article><article class="changelog-entry"><time datetime="2026-09-15">2026.09.15</time><div><h2>0.2.5 <span class="tag">内测</span></h2><ul><li>改善插件弹窗状态稳定性。</li><li>已确认同步的状态不再因例行检查反复闪动。</li></ul></div></article><p><a href="/changelog/rss.xml">订阅更新 RSS</a></p></section></main><!-- footer --><script type="module" src="/src/main.ts"></script></body></html>
